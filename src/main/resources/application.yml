server:
  port: 8080

spring:
  application:
    name: ai-knowledge-base
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境显示 SQL
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: auto
        logic-delete-field: status
        logic-delete-value: deleted
        logic-not-delete-value: active

# CORS配置
cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# 向量存储配置
vectorstore:
  pgvector:
    table-name: embeddings

# 文档配置
document:
  chunk:
    min-tokens: 400
    max-tokens: 800
    overlap-ratio: 0.2
    semantic-threshold: 0.6 # 推荐 0.7-0.8，需要根据数据调优
  parser:
    max-output-size-mb: 200      # Python 进程输出上限，超过则终止解析
  upload:
    max-size-mb: 200             # 上传文件大小上限，超过则拒绝

langchain4j:
  tokenizer:
    model-name: gpt-4o-mini   # 或者 gpt-4o, gpt-3.5-turbo 等

# 查询改写配置
query-rewrite:
  enabled: true                      # 总开关
  config:
    synonyms-path: query-rewrite/synonyms.json
    fixed-mapping-path: query-rewrite/fixed-mapping.json
    stopwords-path: query-rewrite/stopwords.json
  l1:
    confidence-threshold: 0.85       # L1 置信度高于此值直接返回
  l2:
    confidence-threshold: 0.70       # L2 置信度高于此值直接返回

# 三层漏斗纠错配置
corrector:
  l1:
    threshold: 0.85                  # L1 word-checker 置信度阈值
    timeout-ms: 50                   # L1 超时时间（毫秒）
  l2:
    threshold: 0.80                  # L2 拼音匹配 置信度阈值
    timeout-ms: 200                  # L2 超时时间（毫秒）
  l3:
    timeout-ms: 2000                 # L3 LLM 超时时间（毫秒）

# 混合检索配置（并行双路召回 + RRF 融合）
hybrid-search:
  enabled: true                      # 总开关：true=向量+关键词双路召回，false=仅向量检索
  rrf:
    k: 60                            # RRF 常数 k，值越大排名差异越平滑（推荐 60）

# Chat Prompt Token 预算控制
chat:
  prompt:
    max-context-tokens: 3000         # 检索上下文最大 token 数，超出按片段截断
    max-history-tokens: 1500         # 历史对话最大 token 数，超出从最早的消息开始丢弃
    max-assistant-history-chars: 100  # 历史中 assistant 消息截断字符数（用于 LLM 输入和改写）