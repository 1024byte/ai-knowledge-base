server:
  port: 8080

spring:
  application:
    name: ai-knowledge-base
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境显示 SQL
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: auto
        logic-delete-field: status
        logic-delete-value: deleted
        logic-not-delete-value: active

# CORS配置
cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# 向量存储配置
vectorstore:
  pgvector:
    table-name: embeddings

# 文档配置
document:
  chunk:
    min-tokens: 400
    max-tokens: 800
    overlap-ratio: 0.2
    semantic-threshold: 0.6 # 推荐 0.7-0.8，需要根据数据调优
  parser:
    max-output-size-mb: 200      # Python 进程输出上限，超过则终止解析
  upload:
    max-size-mb: 200             # 上传文件大小上限，超过则拒绝

langchain4j:
  tokenizer:
    model-name: gpt-4o-mini   # 或者 gpt-4o, gpt-3.5-turbo 等

# 查询改写配置
query-rewrite:
  enabled: true
  local-llm:
    enabled: true                          # 本地 LLM 改写开关
    base-url: http://localhost:11434       # Ollama 服务地址
    model-name: qwen2.5:3b                # 模型名称
    temperature: 0.1                       # 改写需要确定性，越低越好
    max-tokens: 128                        # 改写结果不需要长文本
    timeout-ms: 2000                        # 严格超时（ms）
    fidelity-threshold: 0.75              # 改写保真度阈值（cosine similarity）
    rewrite-timeout-ms: 1500               # 改写超时时间（毫秒）
    # 以下配置保留但降级为辅助
  l1:
    confidence-threshold: 0.85
  l2:
    confidence-threshold: 0.80



# 三层漏斗纠错配置
corrector:
  l1:
    threshold: 0.85                  # L1 word-checker 置信度阈值
    timeout-ms: 50                   # L1 超时时间（毫秒）
  l2:
    threshold: 0.80                  # L2 拼音匹配 置信度阈值
    timeout-ms: 200                  # L2 超时时间（毫秒）
  l3:
    timeout-ms: 2000                 # L3 LLM 超时时间（毫秒）

# 混合检索配置（并行双路召回 + RRF 融合）
hybrid-search:
  enabled: true                      # 总开关：true=向量+关键词双路召回，false=仅向量检索
  rrf:
    k: 60                            # RRF 常数 k，值越大排名差异越平滑（推荐 60）

# 嵌入模型配置
embedding:
  model-path: models/onnx_model


# Cross-Encoder Rerank 精排配置
reranker:
  enabled: true                     # 总开关：true=启用 Rerank 精排，false=跳过
  model-path: models/bge-reranker-v2-m3  # ONNX 模型目录（含 model.onnx + tokenizer.json）
  timeout-ms: 15000                  # Rerank 超时时间（毫秒，GPU 首次推理需 CUDA 预热）
  max-docs: 5                       # 单次 Rerank 最大文档数（防止 OOM）
  min-score: -4.5                   # Rerank 最低分数阈值，低于此分视为不相关，不送入 LLM
  max-seq-length: 512                # 模型最大序列长度
  gpu-device-id: 0                 # GPU 设备 ID：-1=CPU 推理，>=0=指定 GPU（需安装 CUDA 12.x + cuDNN 9.x）

# Chat Prompt Token 预算控制
chat:
  prompt:
    max-context-tokens: 3000         # 检索上下文最大 token 数，超出按片段截断
    max-history-tokens: 1500         # 历史对话最大 token 数，超出从最早的消息开始丢弃
    max-assistant-history-chars: 100  # 历史中 assistant 消息截断字符数（用于 LLM 输入和改写）
  retrieval:
    top-k: 15