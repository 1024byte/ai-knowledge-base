server:
  port: 8080

spring:
  application:
    name: ai-knowledge-base
  profiles:
    active: dev
  datasource:
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB

  mybatis-plus:
    configuration:
      log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 开发环境显示 SQL
      map-underscore-to-camel-case: true
    global-config:
      db-config:
        id-type: auto
        logic-delete-field: status
        logic-delete-value: deleted
        logic-not-delete-value: active

# CORS配置
cors:
  allowed-origins: "*"
  allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# 向量存储配置
vectorstore:
  pgvector:
    table-name: embeddings

# ============================================================
# 统一阈值配置（所有相似度/分数阈值集中管理）
# ============================================================
thresholds:
  retrieval:
    vector-min-score: 0.7         # 向量检索最低余弦相似度阈值（0.0~1.0），低于此值视为无关
  reranker:
    min-score: -4.5               # [-10, 10] Rerank 最低分数阈值（Cross-Encoder 输出），低于此分不送入 LLM
  chunking:
    semantic: 0.6                 # 语义切分默认阈值（句子与累积向量相似度低于此值时触发切分）
    technical: 0.7                # 技术文档语义切分阈值
    legal: 0.75                   # 法律文档语义切分阈值
    table-heavy: 0.7              # 表格密集文档语义切分阈值
    general: 0.7                  # 通用文档语义切分阈值
    exam-paper: 0.7               # 试卷文档语义切分阈值
  query-rewrite:
    fidelity: 0.75                # 改写保真度阈值（cosine similarity），低于此值丢弃改写结果
    l1-confidence: 0.85           # L1 规则改写置信度阈值
    l2-confidence: 0.80           # L2 规则改写置信度阈值
  corrector:
    l1: 0.85                      # L1 word-checker 纠错置信度阈值
    l2: 0.80                      # L2 拼音匹配纠错置信度阈值

# 文档配置
# 注：document.chunk 的 min/max/overlap-tokens 已迁移至参数管理（param_config.sql → chunk.*），
#     支持热更；知识库未单独配置 chunkLength/overlapLength 时取此处全局默认。
document:
  parser:
    max-output-size-mb: 200      # Python 进程输出上限，超过则终止解析
  upload:
    max-size-mb: 200             # 上传文件大小上限，超过则拒绝

langchain4j:
  tokenizer:
    model-name: gpt-4o-mini   # 或者 gpt-4o, gpt-3.5-turbo 等

# 查询改写配置
query-rewrite:
  enabled: false
  local-llm:
    enabled: true                          # 本地 LLM 改写开关
    base-url: http://localhost:11434       # Ollama 服务地址
    model-name: qwen2.5:3b                # 模型名称
    temperature: 0.1                       # 改写需要确定性，越低越好
    max-tokens: 128                        # 改写结果不需要长文本
    timeout-ms: 2000                        # 严格超时（ms）
    rewrite-timeout-ms: 3000               # 改写超时时间（毫秒）



# 三层漏斗纠错配置
corrector:
  l1:
    timeout-ms: 50                   # L1 超时时间（毫秒）
  l2:
    timeout-ms: 200                  # L2 超时时间（毫秒）
  l3:
    timeout-ms: 2000                 # L3 LLM 超时时间（毫秒）

# 混合检索配置（已迁移至参数管理）
# 总开关 / RRF 常数 k 由参数 retrieval.hybridEnabled / retrieval.rrfK 控制，支持热更，故此处不再保留。

# 嵌入模型配置
embedding:
  model-path: models/bge-base-zh-v1.5


# Cross-Encoder Rerank 精排配置
# 注：rerank.maxDocs / rerank.timeoutMs / rerank.docMaxChars 已迁移至参数管理（param_config.sql → rerank.*），
#     支持热更；此处仅保留启动期定型、无法热更的参数。
reranker:
  enabled: true                     # 启动期总开关：false 则不加载 ONNX 模型（需重启生效）；运行时是否调用精排由参数 rerank.enabled 控制
  model-path: models/bge-reranker-v2-m3  # ONNX 模型目录（含 model.onnx + tokenizer.json）
  max-seq-length: 512                # 模型最大序列长度（token 维度，启动期烤入 tokenizer，无法热更）
  gpu-device-id: 0                 # GPU 设备 ID：-1=CPU 推理，>=0=指定 GPU（需安装 CUDA 12.x + cuDNN 9.x）

# 模型配置中心（Chat / 改写 / Rerank 热切换）
# 说明：模型的实际配置存于数据库 model_config 表（执行 sql/model_config.sql 初始化）；
#       此处仅保留全局刷新间隔与 Key 加密主密钥。
model:
  config:
    reload-ms: 30000                 # 配置快照刷新间隔（毫秒）；保存/激活时也会立即刷新
  secret-key: ${MODEL_CONFIG_SECRET:MY/nnr1WBceKh6QlyoQeYntHd89etXHuRtyAaQuc4uM=} # AES-GCM 主密钥，用于加密存储 API Key；留空则只能用环境变量引用

# Chat Prompt Token 预算控制
chat:
  prompt:
    max-context-tokens: 5000         # 检索上下文最大 token 数，超出按片段截断（复杂推理需更多上下文）
    max-history-tokens: 3000         # 历史对话最大 token 数，超出从最早的消息开始丢弃
    max-assistant-history-chars: 300  # 历史中 assistant 消息截断字符数（用于 LLM 输入和改写）
  retrieval:
    top-k: 15